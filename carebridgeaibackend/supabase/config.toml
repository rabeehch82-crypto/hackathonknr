project_id = "carebridge-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true

[functions.ai-chat]
verify_jwt = true

[functions.analyze-report]
verify_jwt = true

[functions.explain-prescription]
verify_jwt = true

[functions.speech-to-text]
verify_jwt = true

[functions.text-to-speech]
verify_jwt = true

[functions.symptom-checker]
verify_jwt = true

[functions.compute-health-score]
verify_jwt = true

[functions.generate-emergency-qr]
verify_jwt = true

[functions.read-emergency-qr]
verify_jwt = false

[functions.book-appointment]
verify_jwt = true

[functions.caregiver-invite]
verify_jwt = true

[functions.caregiver-respond]
verify_jwt = true

[functions.medication-reminders]
verify_jwt = false
